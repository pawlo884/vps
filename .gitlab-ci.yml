image: python:3.12-slim

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # default callback (community.general.yaml został usunięty w collection 12+)
  ANSIBLE_STDOUT_CALLBACK: "ansible.builtin.default"
  ANSIBLE_FORCE_COLOR: "true"
  # Tagi Ansible - zostaw puste żeby uruchomić wszystko, lub podaj np. "app,landing" / "gitlab_runner"
  # Dostępne tagi: common, fail2ban, web, db, postgres, postgres_test, qdrant, nginx_proxy_manager,
  #                backups, monitoring, portainer, app, landing, n8n, prestashop, gitlab_runner, storage, security
  DEPLOY_TAGS: ""

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install "ansible>=9.0.0" ansible-lint yamllint
  - export ANSIBLE_ROLES_PATH="$CI_PROJECT_DIR/ansible/roles"

lint_ansible:
  stage: lint
  script:
    - cd ansible
    - yamllint . || true  # nie blokuj pipeline'u na stylu YAML
    - ansible-lint playbooks playbooks/site.yml || true  # opcjonalne ostrzeżenia, nie blokują
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

syntax_check:
  stage: test
  script:
    - ansible-playbook -i ansible/inventories/prod/hosts.ini ansible/playbooks/site.yml --syntax-check -e "inventory_dir=ansible/inventories/prod"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

dry_run:
  stage: test
  needs:
    - check_deploy_vars
  script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$ANSIBLE_HOST" >> ~/.ssh/known_hosts
    - mkdir -p ansible/inventories/prod/group_vars
    - echo "[web]" > ansible/inventories/prod/hosts_ci.ini
    - echo "vps ansible_host=$ANSIBLE_HOST ansible_user=pawel ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new' ansible_become=true" >> ansible/inventories/prod/hosts_ci.ini
    - |
      if [ -f "${ANSIBLE_SECRETS}" ]; then
        cp "$ANSIBLE_SECRETS" ansible/inventories/prod/group_vars/secrets.yml
      else
        printf '%s' "$ANSIBLE_SECRETS" > ansible/inventories/prod/group_vars/secrets.yml
      fi
    - |
      TAGS_ARG=""
      if [ -n "${DEPLOY_TAGS}" ]; then TAGS_ARG="--tags ${DEPLOY_TAGS}"; fi
      ansible-playbook -i ansible/inventories/prod/hosts_ci.ini ansible/playbooks/site.yml --check --diff -e "inventory_dir=ansible/inventories/prod" $TAGS_ARG
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Sprawdza, czy zmienne wymagane do deploy_prod są ustawione w GitLab (Settings → CI/CD → Variables).
# ANSIBLE_SECRETS: typ File (GitLab podaje ścieżkę) LUB typ Variable (cała zawartość secrets.yml).
check_deploy_vars:
  stage: test
  script:
    - |
      err=0
      if [ -z "${ANSIBLE_HOST:-}" ]; then echo "❌ ANSIBLE_HOST nie jest ustawione (Settings → CI/CD → Variables)"; err=1; else echo "✅ ANSIBLE_HOST jest ustawione"; fi
      if [ -z "${ANSIBLE_SSH_PRIVATE_KEY:-}" ]; then echo "❌ ANSIBLE_SSH_PRIVATE_KEY nie jest ustawione (Settings → CI/CD → Variables)"; err=1; else echo "✅ ANSIBLE_SSH_PRIVATE_KEY jest ustawione"; fi
      if [ -z "${ANSIBLE_SECRETS:-}" ]; then
        echo "❌ ANSIBLE_SECRETS nie jest ustawione. Dodaj w Settings → CI/CD → Variables:"
        echo "   Typ File – wklej zawartość secrets.yml (GitLab utworzy plik); LUB typ Variable – wklej całą zawartość secrets.yml"
        err=1
      elif [ -f "${ANSIBLE_SECRETS}" ]; then
        echo "✅ ANSIBLE_SECRETS jest ustawione (typ File)"
      else
        echo "✅ ANSIBLE_SECRETS jest ustawione (typ Variable – zawartość)"
      fi
      [ $err -eq 0 ] || exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_prod:
  stage: deploy
  needs:
    - syntax_check
    - check_deploy_vars
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$ANSIBLE_HOST" >> ~/.ssh/known_hosts
    # Inventory dla CI - host z GitLab Variable (hosts.ini ma 127.0.0.1 dla lokalnego testu)
    - mkdir -p ansible/inventories/prod/group_vars
    - echo "[web]" > ansible/inventories/prod/hosts_ci.ini
    - echo "vps ansible_host=$ANSIBLE_HOST ansible_user=pawel ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new' ansible_become=true" >> ansible/inventories/prod/hosts_ci.ini
    # Sekrety: ANSIBLE_SECRETS jako File (ścieżka) lub Variable (zawartość secrets.yml)
    - |
      if [ -f "${ANSIBLE_SECRETS}" ]; then
        cp "$ANSIBLE_SECRETS" ansible/inventories/prod/group_vars/secrets.yml
      else
        printf '%s' "$ANSIBLE_SECRETS" > ansible/inventories/prod/group_vars/secrets.yml
      fi
    - |
      TAGS_ARG=""
      if [ -n "${DEPLOY_TAGS}" ]; then TAGS_ARG="--tags ${DEPLOY_TAGS}"; fi
      ansible-playbook -i ansible/inventories/prod/hosts_ci.ini ansible/playbooks/site.yml -e "inventory_dir=ansible/inventories/prod" $TAGS_ARG
  only:
    - main
  when: manual
  environment:
    name: production

