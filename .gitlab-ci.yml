image: python:3.12-slim

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANSIBLE_STDOUT_CALLBACK: yaml
  ANSIBLE_FORCE_COLOR: "true"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install "ansible>=9.0.0" ansible-lint yamllint
  - export ANSIBLE_ROLES_PATH="$CI_PROJECT_DIR/ansible/roles"

lint_ansible:
  stage: lint
  script:
    - cd ansible
    - yamllint . || true  # nie blokuj pipeline'u na stylu YAML
    - ansible-lint playbooks playbooks/site.yml || true  # opcjonalne ostrzeżenia, nie blokują
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

syntax_check:
  stage: test
  script:
    - ansible-playbook -i ansible/inventories/prod/hosts.ini ansible/playbooks/site.yml --syntax-check -e "inventory_dir=ansible/inventories/prod"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

dry_run:
  stage: test
  script:
    - ansible-playbook -i ansible/inventories/prod/hosts.ini ansible/playbooks/site.yml --check --diff -e "inventory_dir=ansible/inventories/prod"
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_prod:
  stage: deploy
  needs:
    - syntax_check
  script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$ANSIBLE_HOST" >> ~/.ssh/known_hosts
    - ansible-playbook -i ansible/inventories/prod/hosts.ini ansible/playbooks/site.yml -e "inventory_dir=ansible/inventories/prod"
  only:
    - main
  when: manual
  environment:
    name: production

