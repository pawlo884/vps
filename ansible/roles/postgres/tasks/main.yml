---
- name: Ensure PostgreSQL directories exist
  file:
    path: "{{ item.data_dir }}"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0755"
  loop: "{{ postgres_instances }}"
  loop_control:
    label: "{{ item.name }} data dir"

- name: Ensure PostgreSQL backup directories exist
  file:
    path: "{{ item.backups_dir }}"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0755"
  loop: "{{ postgres_instances }}"
  loop_control:
    label: "{{ item.name }} backups dir"

- name: Set postgres compose directory
  set_fact:
    postgres_compose_dir_expanded: "{{ postgres_compose_dir | default('/home/' + vps_user + '/stacks/db') }}"

- name: Ensure docker-compose directory exists
  file:
    path: "{{ postgres_compose_dir_expanded }}"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0755"

- name: Generate docker-compose.yml for PostgreSQL
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_compose_dir_expanded }}/docker-compose.yml"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0644"

- name: Start PostgreSQL containers
  community.docker.docker_compose_v2:
    project_src: "{{ postgres_compose_dir_expanded }}"
    state: present
  become_user: "{{ vps_user }}"
  environment:
    COMPOSE_PROJECT_NAME: postgres
