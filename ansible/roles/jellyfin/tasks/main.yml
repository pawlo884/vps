---
- name: Jellyfin stack
  when: jellyfin_install | default(false)
  block:
    - name: Look up Jellyfin user UID/GID
      ansible.builtin.getent:
        database: passwd
        key: "{{ jellyfin_user }}"

    - name: Check for GPU render device (hardware transcoding)
      ansible.builtin.stat:
        path: "{{ jellyfin_hwaccel_device }}/renderD128"
      register: jellyfin_render_node
      when: jellyfin_hwaccel | default(false)

    - name: Look up render/video group GIDs
      ansible.builtin.getent:
        database: group
      when:
        - jellyfin_hwaccel | default(false)
        - jellyfin_render_node.stat.exists | default(false)

    - name: Set Jellyfin runtime facts
      ansible.builtin.set_fact:
        jellyfin_uid: "{{ getent_passwd[jellyfin_user][1] }}"
        jellyfin_gid: "{{ getent_passwd[jellyfin_user][2] }}"
        jellyfin_hwaccel_enabled: "{{ (jellyfin_hwaccel | default(false)) and (jellyfin_render_node.stat.exists | default(false)) }}"
        jellyfin_group_add: >-
          {{ [ (getent_group | default({})).get('render', [none, none])[1],
               (getent_group | default({})).get('video', [none, none])[1] ] | select | list }}

    - name: Check Jellyfin compose path state
      ansible.builtin.stat:
        path: "{{ jellyfin_compose_dir }}"
      register: jellyfin_compose_path

    - name: Remove wrong Jellyfin compose path when it's not a directory
      ansible.builtin.file:
        path: "{{ jellyfin_compose_dir }}"
        state: absent
      when: jellyfin_compose_path.stat.exists and (not jellyfin_compose_path.stat.isdir)

    - name: Ensure Jellyfin directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ jellyfin_user }}"
        group: "{{ jellyfin_user }}"
        mode: "0755"
      loop:
        - "{{ jellyfin_compose_dir }}"
        - "{{ jellyfin_config_dir }}"
        - "{{ jellyfin_cache_dir }}"
        - "{{ jellyfin_media_dir }}"

    - name: Ensure media library subdirectories exist
      ansible.builtin.file:
        path: "{{ jellyfin_media_dir }}/{{ item }}"
        state: directory
        owner: "{{ jellyfin_user }}"
        group: "{{ jellyfin_user }}"
        mode: "0775"
      loop: "{{ jellyfin_media_subdirs | default([]) }}"

    - name: Generate docker-compose.yml for Jellyfin
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ jellyfin_compose_dir }}/docker-compose.yml"
        owner: "{{ jellyfin_user }}"
        group: "{{ jellyfin_user }}"
        mode: "0644"

    - name: Ensure Docker network for Jellyfin proxy exists
      community.docker.docker_network:
        name: "{{ jellyfin_network }}"
        state: present

    - name: Start Jellyfin stack
      community.docker.docker_compose_v2:
        project_src: "{{ jellyfin_compose_dir }}"
        state: present
        recreate: auto
      register: jellyfin_compose_result
      # --check (docker compose --dry-run) nie pobiera obrazów — "No such image" w dry-run to nie błąd.
      failed_when:
        - jellyfin_compose_result is failed
        - not (ansible_check_mode and 'No such image' in (jellyfin_compose_result.msg | default('')))
      environment:
        COMPOSE_PROJECT_NAME: jellyfin
