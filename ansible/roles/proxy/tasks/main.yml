---
- name: Set proxy compose directory
  set_fact:
    proxy_compose_dir_expanded: "{{ proxy_compose_dir | replace('~', '/home/' + vps_user) }}"

- name: Ensure proxy compose directory exists
  file:
    path: "{{ proxy_compose_dir_expanded }}"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: '0755'
  when: proxy_install | default(true)

- name: Generate docker-compose.yml for Caddy
  template:
    src: docker-compose.yml.j2
    dest: "{{ proxy_compose_dir_expanded }}/docker-compose.yml"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: '0644'
  when: proxy_install | default(true)

- name: Generate Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ proxy_compose_dir_expanded }}/Caddyfile"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: '0644'
  when: proxy_install | default(true) and proxy_domains | length > 0

- name: Start Caddy container
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_compose_dir_expanded }}"
    state: present
    recreate: auto
  become_user: "{{ vps_user }}"
  environment:
    COMPOSE_PROJECT_NAME: caddy
  when: proxy_install | default(true) and proxy_domains | length > 0

