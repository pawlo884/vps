- name: Install nginx
  apt:
    name: nginx
    state: present
  when: nginx_install | default(false)

- name: Ensure nginx is enabled and running
  systemd:
    name: nginx
    state: started
    enabled: true
  when: nginx_install | default(false)

- name: Test nginx config
  command: nginx -t
  register: nginx_test
  changed_when: false
  when: nginx_install | default(false)
