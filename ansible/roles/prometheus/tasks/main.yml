---
- name: Ensure prom stack directory exists
  file:
    path: "{{ prom_stack_dir }}"
    state: directory
    mode: '0755'
  tags: [prometheus]

- name: Create prometheus config directory
  file:
    path: "{{ prom_stack_dir }}/prometheus"
    state: directory
    mode: '0755'
  tags: [prometheus]

- name: Create grafana provisioning directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ prom_stack_dir }}/grafana/provisioning/datasources"
    - "{{ prom_stack_dir }}/grafana/provisioning/dashboards"
    - "{{ prom_stack_dir }}/grafana/dashboards"
  tags: [prometheus]

- name: Deploy prometheus.yml
  template:
    src: prometheus.yml.j2
    dest: "{{ prom_stack_dir }}/prometheus/prometheus.yml"
    mode: '0644'
  tags: [prometheus]

- name: Deploy Grafana datasource provisioning
  template:
    src: grafana/provisioning/datasources/datasource.yml.j2
    dest: "{{ prom_stack_dir }}/grafana/provisioning/datasources/datasource.yml"
    mode: '0644'
  tags: [prometheus]

- name: Deploy Grafana dashboards provisioning
  template:
    src: grafana/provisioning/dashboards/dashboards.yml.j2
    dest: "{{ prom_stack_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    mode: '0644'
  tags: [prometheus]

- name: Deploy basic Grafana dashboards
  template:
    src: "{{ item.src }}"
    dest: "{{ prom_stack_dir }}/grafana/dashboards/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'grafana/dashboards/host-overview.json.j2', dest: 'host-overview.json' }
    - { src: 'grafana/dashboards/containers-overview.json.j2', dest: 'containers-overview.json' }
  tags: [prometheus]

- name: Download community dashboards from grafana.com (non-blocking)
  get_url:
    url: "{{ item.url }}"
    dest: "{{ prom_stack_dir }}/grafana/dashboards/{{ item.dest }}"
    mode: '0644'
    force: yes
  loop:
    - { url: "https://grafana.com/api/dashboards/1860/revisions/latest/download", dest: "node-exporter-full.json" }
    - { url: "https://grafana.com/api/dashboards/179/revisions/latest/download", dest: "docker-container-host.json" }
    - { url: "https://grafana.com/api/dashboards/9628/revisions/latest/download", dest: "postgresql-database.json" }
  register: grafana_dashboards_download
  failed_when: false
  tags: [prometheus]

- name: Warn if any dashboard download failed
  debug:
    msg: "Nie udało się pobrać dashboardu {{ item.item.dest }} z {{ item.item.url }} (status: {{ item.status_code | default('n/a') }}, msg: {{ item.msg | default('brak szczegółów') }})"
  loop: "{{ grafana_dashboards_download.results | default([]) }}"
  when: item.failed | default(false)
  tags: [prometheus]

- name: Deploy docker-compose.yml for observability
  template:
    src: docker-compose.yml.j2
    dest: "{{ prom_stack_dir }}/docker-compose.yml"
    mode: '0644'
  tags: [prometheus]

- name: Ensure Docker network exists
  command: docker network create {{ prom_docker_network }}
  register: create_net
  failed_when: false
  changed_when: "'already exists' not in create_net.stderr"
  tags: [prometheus]

- name: Bring up observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ prom_stack_dir }}"
    state: present
    recreate: auto
    remove_orphans: yes
  tags: [prometheus]


