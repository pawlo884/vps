# W trybie --check moduł apt wymaga python3-apt na hoście; przy braku pakietu pomijamy zadania apt
- name: Check if python3-apt is available (for check mode)
  command: python3 -c "import apt"
  register: python3_apt_check
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: not ansible_check_mode or (python3_apt_check.rc | default(1) == 0)

- name: Install base packages
  apt:
    name: "{{ base_packages }}"
    state: present
  when: not ansible_check_mode or (python3_apt_check.rc | default(1) == 0)

- name: Configure automatic security updates
  apt:
    name: unattended-upgrades
    state: present
  when: '"unattended-upgrades" in base_packages and (not ansible_check_mode or (python3_apt_check.rc | default(1) == 0))'

- name: Configure unattended-upgrades automatic reboot
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
    content: |
      // Automatyczny restart po aktualizacjach kernela
      Unattended-Upgrade::AutomaticReboot "true";
      Unattended-Upgrade::AutomaticRebootTime "04:00";
      // Restartuj tylko jeśli nie ma aktywnych użytkowników SSH (ostrożnie!)
      // Unattended-Upgrade::AutomaticRebootWithUsers "false";
    mode: "0644"
  when: '"unattended-upgrades" in base_packages'

# Docker installation
- name: Install Docker
  shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  when: docker_install | default(false)

- name: Install docker-compose-plugin
  apt:
    name: docker-compose-plugin
    state: present
    update_cache: yes
  when: docker_install | default(false) and (not ansible_check_mode or (python3_apt_check.rc | default(1) == 0))

- name: Add user to docker group
  user:
    name: "{{ vps_user }}"
    groups: docker
    append: yes
  when: docker_install | default(false)

- name: Remove extra UFW allow rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    delete: true
  loop: "{{ ufw_removed_ports }}"
  when: ufw_enabled | default(false) and ufw_removed_ports is defined
  failed_when: false

- name: Configure UFW firewall
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ ufw_allowed_ports }}"
  when: ufw_allowed_ports is defined and (ufw_enabled | default(false))

- name: Allow Docker networks to selected host ports
  community.general.ufw:
    rule: allow
    src: "{{ item.src | default('172.16.0.0/12') }}"
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ ufw_docker_to_host_ports | default([]) }}"
  when: ufw_enabled | default(false) and (ufw_docker_to_host_ports | default([]) | length > 0)

- name: Set UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {
        direction: "incoming",
        policy: '{{ "deny" if ufw_default_deny_incoming else "allow" }}',
      }
    - {
        direction: "outgoing",
        policy: '{{ "allow" if ufw_default_allow_outgoing else "deny" }}',
      }
  when: ufw_enabled | default(false)
- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: ufw_enabled | default(false)

- name: Check if k3s is installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  when: k3s_restrict_api | default(false)

- name: Ensure k3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when:
    - k3s_restrict_api | default(false)
    - k3s_binary is not skipped
    - k3s_binary.stat.exists | default(false)

- name: Configure k3s bind-address and kubelet address
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      # Ansible: API i kubelet na IP węzła ({{ k3s_node_ip | default(ansible_default_ipv4.address) }})
      bind-address: {{ k3s_node_ip | default(ansible_default_ipv4.address) }}
      kubelet-arg:
        - address={{ k3s_node_ip | default(ansible_default_ipv4.address) }}
    mode: "0644"
  notify: restart k3s
  when:
    - k3s_restrict_api | default(false)
    - k3s_binary is not skipped
    - k3s_binary.stat.exists | default(false)

- name: Allow kubelet from node IP
  community.general.ufw:
    rule: allow
    src: "{{ k3s_node_ip | default(ansible_default_ipv4.address) }}"
    port: "10250"
    proto: tcp
    comment: "k3s kubelet"
  when:
    - ufw_enabled | default(false)
    - k3s_restrict_api | default(false)
    - k3s_binary is not skipped
    - k3s_binary.stat.exists | default(false)

- name: Check native Netdata config
  stat:
    path: /etc/netdata/netdata.conf
  register: netdata_conf
  when: monitoring_native_bind_localhost | default(true)

- name: Bind native Netdata to localhost
  lineinfile:
    path: /etc/netdata/netdata.conf
    regexp: '^\s*bind to\s*='
    line: "\tbind to = 127.0.0.1"
  notify: restart native netdata
  when:
    - monitoring_native_bind_localhost | default(true)
    - netdata_conf is not skipped
    - netdata_conf.stat.exists | default(false)

# Hardening: sysctl
- name: Configure sysctl (vm.swappiness)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ sysctl_swappiness | default(10) }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-vm.conf
    reload: yes

# Hardening: Docker log limits
- name: Ensure Docker config directory exists
  file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon.json (log limits)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size | default('50m') }}",
          "max-file": "{{ docker_log_max_file | default('3') }}"
        }
      }
    mode: "0644"
  notify: restart docker

# Hardening: journald limits
- name: Ensure journald config directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure journald size limit
  copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ journald_max_size | default('200M') }}
    mode: "0644"
  notify: restart systemd-journald

# Hardening: Enable fstrim.timer
- name: Enable and start fstrim.timer
  systemd:
    name: fstrim.timer
    enabled: yes
    state: started

# Auto-login configuration
- name: Ensure getty override directory exists
  file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: '0755'

- name: Configure auto-login for user
  copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ vps_user }} --noclear %I $TERM
    mode: '0644'
  notify: reload systemd

# Disable swap
- name: Disable swap
  shell: swapoff -a
  ignore_errors: yes
  changed_when: false

- name: Remove swap entry from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^.*swap.*$'
    state: absent

- name: Remove swap file if exists
  file:
    path: /swap.img
    state: absent
  ignore_errors: yes

# Docker cleanup - automatyczne czyszczenie starych obrazów
- name: Parse docker cleanup schedule
  set_fact:
    docker_cleanup_minute: "{{ docker_cleanup_schedule.split()[0] }}"
    docker_cleanup_hour: "{{ docker_cleanup_schedule.split()[1] }}"
    docker_cleanup_day: "{{ docker_cleanup_schedule.split()[2] }}"
    docker_cleanup_month: "{{ docker_cleanup_schedule.split()[3] }}"
    docker_cleanup_weekday: "{{ docker_cleanup_schedule.split()[4] }}"
  when: docker_cleanup_enabled | default(true)

- name: Create Docker cleanup script
  copy:
    dest: /usr/local/bin/docker_cleanup.sh
    content: |
      #!/bin/bash
      # Automatyczne czyszczenie obrazów Docker
      # Usuwa dangling images i opcjonalnie wszystkie nieużywane obrazy
      
      LOG_FILE="/var/log/docker_cleanup.log"
      echo "$(date): Rozpoczynam czyszczenie Docker..." >> "$LOG_FILE"
      
      {% if docker_cleanup_prune_all | default(false) %}
      # Usuń wszystkie nieużywane obrazy (ostrożnie!)
      docker image prune -a -f >> "$LOG_FILE" 2>&1
      {% else %}
      # Usuń tylko dangling images (bezpieczniejsze)
      docker image prune -f >> "$LOG_FILE" 2>&1
      {% endif %}
      
      # Usuń nieużywane kontenery
      docker container prune -f >> "$LOG_FILE" 2>&1
      
      # Usuń nieużywane volumes (ostrożnie - może usuwać dane!)
      # docker volume prune -f >> "$LOG_FILE" 2>&1
      
      # Usuń nieużywane sieci
      docker network prune -f >> "$LOG_FILE" 2>&1
      
      echo "$(date): Czyszczenie Docker zakończone" >> "$LOG_FILE"
    mode: '0755'
  when: docker_cleanup_enabled | default(true)

- name: Ensure Docker cleanup cron job
  cron:
    name: "Docker cleanup - czyszczenie starych obrazów"
    minute: "{{ docker_cleanup_minute }}"
    hour: "{{ docker_cleanup_hour }}"
    day: "{{ docker_cleanup_day }}"
    month: "{{ docker_cleanup_month }}"
    weekday: "{{ docker_cleanup_weekday }}"
    job: "/usr/local/bin/docker_cleanup.sh"
    user: root
  when: docker_cleanup_enabled | default(true)