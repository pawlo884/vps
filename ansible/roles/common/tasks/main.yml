- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name: "{{ base_packages }}"
    state: present

- name: Configure automatic security updates
  apt:
    name: unattended-upgrades
    state: present
  when: "'unattended-upgrades' in base_packages"

- name: Configure unattended-upgrades automatic reboot
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
    content: |
      // Automatyczny restart po aktualizacjach kernela
      Unattended-Upgrade::AutomaticReboot "true";
      Unattended-Upgrade::AutomaticRebootTime "04:00";
      // Restartuj tylko jeśli nie ma aktywnych użytkowników SSH (ostrożnie!)
      // Unattended-Upgrade::AutomaticRebootWithUsers "false";
    mode: "0644"
  when: "'unattended-upgrades' in base_packages"

# Docker installation
- name: Install Docker
  shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  when: docker_install | default(false)

- name: Install docker-compose-plugin
  apt:
    name: docker-compose-plugin
    state: present
    update_cache: yes
  when: docker_install | default(false)

- name: Add user to docker group
  user:
    name: "{{ vps_user }}"
    groups: docker
    append: yes
  when: docker_install | default(false)

- name: Configure UFW firewall
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ ufw_allowed_ports }}"
  when: ufw_allowed_ports is defined

- name: Set UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {
        direction: "incoming",
        policy: '{{ "deny" if ufw_default_deny_incoming else "allow" }}',
      }
    - {
        direction: "outgoing",
        policy: '{{ "allow" if ufw_default_allow_outgoing else "deny" }}',
      }

- name: Enable UFW
  community.general.ufw:
    state: enabled

# Hardening: sysctl
- name: Configure sysctl (vm.swappiness)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ sysctl_swappiness | default(10) }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-vm.conf
    reload: yes

# Hardening: Docker log limits
- name: Ensure Docker config directory exists
  file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon.json (log limits)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size | default('50m') }}",
          "max-file": "{{ docker_log_max_file | default('3') }}"
        }
      }
    mode: "0644"
  notify: restart docker

# Hardening: journald limits
- name: Ensure journald config directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure journald size limit
  copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ journald_max_size | default('200M') }}
    mode: "0644"
  notify: restart systemd-journald

# Hardening: Enable fstrim.timer
- name: Enable and start fstrim.timer
  systemd:
    name: fstrim.timer
    enabled: yes
    state: started

# Auto-login configuration
- name: Ensure getty override directory exists
  file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: '0755'

- name: Configure auto-login for user
  copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ vps_user }} --noclear %I $TERM
    mode: '0644'
  notify: reload systemd

# Disable swap
- name: Disable swap
  shell: swapoff -a
  ignore_errors: yes
  changed_when: false

- name: Remove swap entry from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^.*swap.*$'
    state: absent

- name: Remove swap file if exists
  file:
    path: /swap.img
    state: absent
  ignore_errors: yes

# Docker cleanup - automatyczne czyszczenie starych obrazów
- name: Parse docker cleanup schedule
  set_fact:
    docker_cleanup_minute: "{{ docker_cleanup_schedule.split()[0] }}"
    docker_cleanup_hour: "{{ docker_cleanup_schedule.split()[1] }}"
    docker_cleanup_day: "{{ docker_cleanup_schedule.split()[2] }}"
    docker_cleanup_month: "{{ docker_cleanup_schedule.split()[3] }}"
    docker_cleanup_weekday: "{{ docker_cleanup_schedule.split()[4] }}"
  when: docker_cleanup_enabled | default(true)

- name: Create Docker cleanup script
  copy:
    dest: /usr/local/bin/docker_cleanup.sh
    content: |
      #!/bin/bash
      # Automatyczne czyszczenie obrazów Docker
      # Usuwa dangling images i opcjonalnie wszystkie nieużywane obrazy
      
      LOG_FILE="/var/log/docker_cleanup.log"
      echo "$(date): Rozpoczynam czyszczenie Docker..." >> "$LOG_FILE"
      
      {% if docker_cleanup_prune_all | default(false) %}
      # Usuń wszystkie nieużywane obrazy (ostrożnie!)
      docker image prune -a -f >> "$LOG_FILE" 2>&1
      {% else %}
      # Usuń tylko dangling images (bezpieczniejsze)
      docker image prune -f >> "$LOG_FILE" 2>&1
      {% endif %}
      
      # Usuń nieużywane kontenery
      docker container prune -f >> "$LOG_FILE" 2>&1
      
      # Usuń nieużywane volumes (ostrożnie - może usuwać dane!)
      # docker volume prune -f >> "$LOG_FILE" 2>&1
      
      # Usuń nieużywane sieci
      docker network prune -f >> "$LOG_FILE" 2>&1
      
      echo "$(date): Czyszczenie Docker zakończone" >> "$LOG_FILE"
    mode: '0755'
  when: docker_cleanup_enabled | default(true)

- name: Ensure Docker cleanup cron job
  cron:
    name: "Docker cleanup - czyszczenie starych obrazów"
    minute: "{{ docker_cleanup_minute }}"
    hour: "{{ docker_cleanup_hour }}"
    day: "{{ docker_cleanup_day }}"
    month: "{{ docker_cleanup_month }}"
    weekday: "{{ docker_cleanup_weekday }}"
    job: "/usr/local/bin/docker_cleanup.sh"
    user: root
  when: docker_cleanup_enabled | default(true)