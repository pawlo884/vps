---
- name: restart docker
  systemd:
    name: docker
    state: restarted
  when: docker_install | default(false)

- name: restart systemd-journald
  systemd:
    name: systemd-journald
    state: restarted

- name: reload systemd
  command: systemctl daemon-reload

- name: restart native netdata
  systemd:
    name: netdata
    state: restarted
  failed_when: false
