---

- name: Ensure Netdata go.d directory exists
  file:
    path: "{{ monitoring_config_path }}/go.d"
    state: directory
    mode: '0755'

- name: Configure Netdata nvme monitoring
  template:
    src: nvme.conf.j2
    dest: "{{ monitoring_config_path }}/go.d/nvme.conf"
    mode: '0644'

- name: Merge postgres_instances with passwords from secrets for monitoring
  set_fact:
    monitoring_postgres_instances: "{{ monitoring_postgres_instances | default([]) + [item | combine((postgres_instances_secrets | default([]) | selectattr('name', 'equalto', item.name) | first | default({}))) | combine({'host': 'postgres_' + item.name, 'port': '5432'})] }}"
  vars:
    _secrets: "{{ postgres_instances_secrets | default([]) }}"
  loop: "{{ postgres_instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: 
    - monitoring_postgres_enabled | default(true)
    - postgres_instances is defined
    - postgres_instances | length > 0
  no_log: true  # Ukryj hasła w logach

- name: Configure Netdata PostgreSQL monitoring
  template:
    src: postgres.conf.j2
    dest: "{{ monitoring_config_path }}/go.d/postgres.conf"
    mode: '0644'
  when: 
    - monitoring_postgres_enabled | default(true)
    - monitoring_postgres_instances | default([]) | length > 0

- name: Configure Netdata main config
  template:
    src: netdata.conf.j2
    dest: "{{ monitoring_config_path }}/netdata.conf"
    mode: '0644'
  when: monitoring_install | default(true)

- name: Create htpasswd file for Netdata basic auth
  htpasswd:
    path: "{{ monitoring_config_path }}/.htpasswd"
    name: "{{ monitoring_auth_user }}"
    password: "{{ monitoring_auth_password }}"
    owner: root
    group: root
    mode: '0644'
    create: yes
  when:
    - monitoring_install | default(true)
    - monitoring_auth_enabled | default(true)
    - monitoring_auth_user is defined
    - monitoring_auth_password is defined
  no_log: true

- name: Check if Netdata is already running
  shell: docker ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter "name={{ monitoring_container_name }}"
  register: netdata_running
  changed_when: false
  failed_when: false
  when: monitoring_install | default(true)

- name: Check if port {{ monitoring_port }} is already in use
  shell: ss -tuln | grep -q ":{{ monitoring_port }}" && echo "in_use" || echo "free"
  register: netdata_port_check
  changed_when: false
  failed_when: false
  when: monitoring_install | default(true)

- name: Fail if Netdata port is busy but container is not running
  ansible.builtin.fail:
    msg: >
      Port 127.0.0.1:{{ monitoring_port }} jest zajęty, a kontener {{ monitoring_container_name }} nie działa.
      Zatrzymaj usługę blokującą port (często po apt: natywny netdata), np.:
      sudo systemctl stop netdata && sudo systemctl disable netdata
      albo usuń inny kontener mapujący ten port (docker ps -a).
  when:
    - monitoring_install | default(true)
    - netdata_port_check.stdout | default('free') != 'free'
    - monitoring_container_name not in (netdata_running.stdout | default(''))

- name: Build Netdata volumes list
  set_fact:
    netdata_volumes: "{{ ['netdata-data:/var/lib/netdata', 'netdata-config:/etc/netdata'] + ([monitoring_config_path + '/.htpasswd:/etc/netdata/.htpasswd:ro'] if (monitoring_auth_enabled | default(true) and monitoring_auth_user is defined and monitoring_auth_password is defined) else []) }}"
  when: monitoring_install | default(true)

- name: Start Netdata container
  community.docker.docker_container:
    name: "{{ monitoring_container_name }}"
    image: "{{ monitoring_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "127.0.0.1:{{ monitoring_port }}:19999"
    volumes: "{{ netdata_volumes }}"
    networks:
      - name: "{{ postgres_network | default('dbnet') }}"
    capabilities:
      - SYS_PTRACE
    security_opts:
      - apparmor=unconfined
    comparisons:
      networks: strict
      volumes: strict
      '*': ignore
  when:
    - monitoring_install | default(true)
    # Uruchom tylko gdy port wolny albo już działa nasz kontener (idempotentnie); OR było błędne —
    # przy zajętym porcie i braku kontenera playbook pada wcześniej na fail powyżej.
    - (netdata_port_check.stdout | default('free') == 'free') or (monitoring_container_name in (netdata_running.stdout | default('')))

