---
# Netdata monitoring configuration
monitoring_install: true
monitoring_image: netdata/netdata
monitoring_port: 19999
monitoring_container_name: netdata
# Naprawione 2026-09-13: ta ścieżka nigdy nie istniała na serwerze — Netdata
# działa natywnie (apt/systemd), nie w Dockerze (rola ma zabezpieczenie:
# "Fail if Netdata port is busy but container is not running", więc bezpiecznie
# odmówi próby postawienia kontenera obok natywnej instalacji). Skutek: konfigi
# go.d (nvme.conf, postgres.conf) zawsze lądowały donikąd — monitoring
# Postgresa przez Netdata nigdy realnie nie działał. Poprawiona ścieżka wskazuje
# na prawdziwy katalog configu. UWAGA: ponowne odpalenie tej roli nadpisze
# /etc/netdata/netdata.conf szablonem netdata.conf.j2 — zweryfikuj go najpierw
# względem obecnego pliku na serwerze.
monitoring_config_path: /etc/netdata
monitoring_nvme_devices:
  - /dev/nvme0n1

# PostgreSQL monitoring
monitoring_postgres_enabled: true
# Lista instancji PostgreSQL do monitorowania (będzie automatycznie wypełniona z postgres_instances)
monitoring_postgres_instances: []

# Netdata security
monitoring_auth_enabled: true  # Włącz basic authentication
# monitoring_auth_user i monitoring_auth_password są w secrets.yml

