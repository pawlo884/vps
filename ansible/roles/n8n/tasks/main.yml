---
- name: Check n8n compose path state
  stat:
    path: "{{ n8n_compose_dir }}"
  register: n8n_compose_path

- name: Remove wrong n8n compose path when it's not a directory
  file:
    path: "{{ n8n_compose_dir }}"
    state: absent
  when: n8n_compose_path.stat.exists and (not n8n_compose_path.stat.isdir)

- name: Ensure n8n directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ n8n_user }}"
    group: "{{ n8n_user }}"
    mode: "0755"
  loop:
    - "{{ n8n_compose_dir }}"
    - "{{ n8n_data_dir }}"

- name: Merge n8n_env with secrets (from secrets.yml)
  set_fact:
    n8n_env: "{{ n8n_env | default({}) | combine(n8n_env_secrets | default({})) }}"
  when: n8n_env_secrets is defined

- name: Generate docker-compose.yml for n8n
  template:
    src: docker-compose.yml.j2
    dest: "{{ n8n_compose_dir }}/docker-compose.yml"
    owner: "{{ n8n_user }}"
    group: "{{ n8n_user }}"
    mode: "0644"

- name: Ensure Docker network for n8n exists
  community.docker.docker_network:
    name: "{{ n8n_network }}"
    state: present
  when: not ansible_check_mode

- name: Start n8n stack
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_compose_dir }}"
    state: present
    recreate: auto
  environment:
    COMPOSE_PROJECT_NAME: "n8n"
  when: not ansible_check_mode
