---
- name: Check if Nginx Proxy Manager container already exists
  shell: docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' --filter "name={{ nginx_proxy_manager_container_name }}"
  register: npm_exists
  changed_when: false
  failed_when: false

- name: Check if Nginx Proxy Manager is running
  shell: docker ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter "name={{ nginx_proxy_manager_container_name }}"
  register: npm_running
  changed_when: false
  failed_when: false
  when: npm_exists.stdout != ""

- name: Display existing Nginx Proxy Manager status
  debug:
    msg: "Nginx Proxy Manager już istnieje i {{ 'działa' if npm_running.stdout != '' else 'jest zatrzymany' }}. Ustaw nginx_proxy_manager_takeover: true w all.yml aby przejąć zarząd."
  when: npm_exists.stdout != "" and not nginx_proxy_manager_takeover | default(false)

- name: Stop and remove existing Nginx Proxy Manager (if takeover enabled)
  command: docker rm -f {{ nginx_proxy_manager_container_name }}
  when: 
    - npm_exists.stdout != ""
    - nginx_proxy_manager_takeover | default(false)

- name: Set nginx proxy manager compose directory
  set_fact:
    npm_compose_dir_expanded: "{{ (nginx_proxy_manager_compose_dir | default('/home/' + vps_user + '/stacks/nginx-proxy-manager')) | regex_replace('^~', '/home/' + vps_user) }}"

- name: Ensure Nginx Proxy Manager directories exist
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0755'
  loop:
    - { path: "{{ npm_compose_dir_expanded }}", owner: "{{ vps_user }}" }
    # Dane NPM zapisuje kontener jako root — tak jest na serwerze, nie zmieniamy.
    - { path: "{{ nginx_proxy_manager_data_dir }}", owner: root }
    - { path: "{{ nginx_proxy_manager_letsencrypt_dir }}", owner: root }
  loop_control:
    label: "{{ item.path }}"

- name: Generate docker-compose.yml for Nginx Proxy Manager
  template:
    src: docker-compose.yml.j2
    dest: "{{ npm_compose_dir_expanded }}/docker-compose.yml"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0644"

- name: Start Nginx Proxy Manager container
  community.docker.docker_compose_v2:
    project_src: "{{ npm_compose_dir_expanded }}"
    state: present
    recreate: auto
  register: npm_compose_result
  # --check (docker compose --dry-run) nie pobiera ani nie buduje obrazów, więc
  # recreate na nowym tagu kończy się "No such image" — w dry-run to nie jest błąd.
  failed_when:
    - npm_compose_result is failed
    - not (ansible_check_mode and 'No such image' in (npm_compose_result.msg | default('')))
  become_user: "{{ vps_user }}"
  environment:
    COMPOSE_PROJECT_NAME: nginx-proxy-manager
  when: nginx_proxy_manager_install | default(true)
