---
- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes
  tags: [fail2ban]

- name: Ensure fail2ban directory exists
  file:
    path: /etc/fail2ban
    state: directory
    mode: '0755'
  tags: [fail2ban]

- name: Deploy jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban
  tags: [fail2ban]

- name: Ensure fail2ban is enabled and running
  systemd:
    name: fail2ban
    enabled: yes
    state: started
  tags: [fail2ban]


