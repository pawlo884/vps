---
- name: Check if old test PostgreSQL container exists
  shell: docker ps -a --format "{{ '{{' }}.Names{{ '}}' }}" | grep -q "^{{ postgres_test_container_name }}$" || echo "not_found"
  register: old_container_check
  changed_when: false
  failed_when: false
  when: postgres_test_enabled | default(true)

- name: Stop old test PostgreSQL container if exists
  command: docker stop {{ postgres_test_container_name }}
  when: 
    - postgres_test_enabled | default(true)
    - old_container_check.stdout != "not_found"
  ignore_errors: yes
  register: stop_result
  changed_when: stop_result.rc == 0

- name: Remove old test PostgreSQL container if exists
  command: docker rm {{ postgres_test_container_name }}
  when: 
    - postgres_test_enabled | default(true)
    - old_container_check.stdout != "not_found"
  ignore_errors: yes
  register: rm_result
  changed_when: rm_result.rc == 0

- name: Set postgres test compose directory
  set_fact:
    postgres_test_compose_dir_expanded: "{{ (postgres_test_compose_dir | default('~/stacks/test-postgres')) | regex_replace('^~', '/home/' + vps_user) }}"
  when: postgres_test_enabled | default(true)

- name: Ensure test-postgres compose directory exists
  file:
    path: "{{ postgres_test_compose_dir_expanded }}"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0755"
  when: postgres_test_enabled | default(true)

- name: Copy docker-compose.yml for test PostgreSQL
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_test_compose_dir_expanded }}/docker-compose.yml"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0644"
  when: postgres_test_enabled | default(true)

- name: Copy postgresql.conf for test PostgreSQL
  template:
    src: postgresql.conf.j2
    dest: "{{ postgres_test_compose_dir_expanded }}/postgresql.conf"
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: "0644"
  when: postgres_test_enabled | default(true)

- name: Start test PostgreSQL containers
  community.docker.docker_compose_v2:
    project_src: "{{ postgres_test_compose_dir_expanded }}"
    state: present
    recreate: auto
  become_user: "{{ vps_user }}"
  environment:
    COMPOSE_PROJECT_NAME: test-postgres
  when: postgres_test_enabled | default(true)

