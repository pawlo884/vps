---
# Konfiguracja kontenera testowego PostgreSQL
postgres_test_enabled: true
postgres_test_compose_dir: ~/stacks/test-postgres
postgres_test_image: postgres:18.1-alpine
postgres_test_container_name: nc-postgres-test
postgres_test_port: "5433:5432"
postgres_test_volume: nc_postgres_test_data
postgres_test_network: test_network

# Zmienne środowiskowe (hasło w secrets.yml)
postgres_test_user: testuser
postgres_test_db: testdb
# postgres_test_password: nadpisywane przez secrets.yml

