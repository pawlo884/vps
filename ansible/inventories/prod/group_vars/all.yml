---
# Podstawowe pakiety systemowe
base_packages:
  - git
  - curl
  - wget
  - vim
  - htop
  - unattended-upgrades
  - ufw

# Użytkownik VPS
vps_user: pawel

# Docker
docker_install: true
# Publikacja portów Dockera tylko na loopback. Publiczny ruch: 22/80/443 (NPM).
docker_publish_bind: "127.0.0.1"
# Mostek docker0: k3s (nc-prod) łączy się do Postgresa przez 172.17.0.1, nie 127.0.0.1.
docker_k3s_host_bind: "172.17.0.1"

# Firewall UFW — publicznie tylko SSH i NPM (HTTP/HTTPS).
# Panele (Portainer, pgAdmin, NPM :81, Netdata, MinIO) przez domenę w NPM albo:
#   ssh -L 81:127.0.0.1:81 -L 9000:127.0.0.1:9000 -L 5050:127.0.0.1:5050 -L 19999:127.0.0.1:19999 pawel@HOST
ufw_enabled: true
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
ufw_removed_ports:
  - { port: 81, proto: tcp }
  - { port: 19999, proto: tcp }
  - { port: 8000, proto: tcp }
  - { port: 8001, proto: tcp }
  - { port: 8501, proto: tcp }
  - { port: 8599, proto: tcp }
  - { port: 9000, proto: tcp }
  - { port: 9100, proto: tcp }
  - { port: 9101, proto: tcp }
  - { port: 6333, proto: tcp }
  - { port: 6334, proto: tcp }
  - { port: 5050, proto: tcp }

# NPM (sieć Dockera) → procesy na hoście. Nie otwiera portu na świat.
ufw_docker_to_host_ports:
  - { port: 8599, proto: tcp, src: "172.16.0.0/12", comment: "NPM to Soundcore Streamlit" }

ufw_default_deny_incoming: true
ufw_default_allow_outgoing: true

# k3s API tylko na localhost (kubectl zostaje na 127.0.0.1:6443)
k3s_restrict_api: true
# Natywny Netdata (systemd) też tylko localhost
monitoring_native_bind_localhost: true

# Sysctl
sysctl_swappiness: 10

# Docker cleanup schedule (cron format: minute hour day month weekday)
docker_cleanup_schedule: "0 3 * * 0" # Co niedzielę o 3:00

# WiFi configuration
wifi_configure: false # Ustaw na true jeśli chcesz skonfigurować WiFi

# PostgreSQL test instance
postgres_test_enabled: true
postgres_test_password: "testpass123" # Zmień w secrets.yml!

# PostgreSQL instances secrets (dla prometheus i monitoring)
postgres_instances_secrets: []

# pgAdmin configuration
pgadmin_install: true # Włącz pgAdmin (można zmienić w secrets.yml)

# Takeover - pozwól Ansible przejąć zarządzanie istniejącymi kontenerami
portainer_takeover: true
nginx_proxy_manager_takeover: true

# Landing page configuration
landing_install: true
landing_use_nextjs: true # Używa Next.js zamiast statycznych plików HTML
landing_port: 3000 # Next.js domyślnie na porcie 3000

# Landing page - konfiguracja repo
landing_repo_url: "git@github.com:pawlo884/sowa-landing.git"
landing_repo_branch: main
landing_repo_dir: ~/landing-page # Lokalizacja na VPS gdzie będzie sklonowane repo

# Lista aplikacji wyświetlanych na landing page (opcjonalnie - można też w repo)
# Jeśli puste, landing page użyje danych z repo (np. apps.json lub apps.js)
landing_applications: []
  # Przykład z domenami:
  # - name: "Portainer"
  #   url: "https://portainer.sowa.ch"
  #   description: "Zarządzanie kontenerami Docker"
  # - name: "Nginx Proxy Manager"
  #   url: "https://npm.sowa.ch"
  #   description: "Zarządzanie reverse proxy"
  # - name: "Aplikacja Django"
  #   url: "https://app.sowa.ch"
  #   description: "Główna aplikacja Django"

# Nginx Proxy Manager - panel admina na 127.0.0.1:81 (nie na świat).
# npm.sowa.ch musi iść do 127.0.0.1:81 WEWNĄTRZ kontenera NPM (nie 172.17.0.1).
# Nginx Proxy Manager - domeny konfigurujesz przez GUI na porcie 81
# Po uruchomieniu kontenera landing, dodaj w NPM:
# - Domain: sowa.ch
# - Forward hostname/IP: landing
# - Forward port: 3000  # Next.js działa na porcie 3000
# - SSL: Request SSL Certificate (Let's Encrypt)
app_dockerfile_path: "deployments/docker/Dockerfile.prod"
app_env_force: true
app_compose_build_policy: never
app_compose_pull_policy: never
app_compose_recreate_policy: auto
app_manage_containers: false
n8n_data_dir: /srv/n8n
n8n_compose_dir: "/home/{{ vps_user }}/stacks/n8n"
n8n_network: nginx_proxy_manager_network
