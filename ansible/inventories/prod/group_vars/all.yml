# Ogólne ustawienia VPS
vps_hostname: vps
vps_user: pawel

# Firewall
ufw_default_deny_incoming: true
ufw_default_allow_outgoing: true
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 8000, proto: tcp, comment: "Django app" }
  - { port: 9000, proto: tcp, comment: "Portainer" }
  - { port: 19999, proto: tcp, comment: "Netdata monitoring" }

# WiFi configuration
# UWAGA: Ustaw wifi_configure: true aby włączyć konfigurację WiFi
wifi_configure: true  # Zmień na true aby włączyć
wifi_interface: "wlp0s20f3"  # Nazwa interfejsu WiFi (sprawdź przez: ip link show)
wifi_dhcp: false  # Użyj DHCP (true) lub statycznego IP (false)

# Statyczny IP
wifi_static_address: "192.168.50.31/24"
wifi_static_gateway: "192.168.50.1"
wifi_static_nameservers:
  - "1.1.1.1"
  - "8.8.8.8"

# Lista sieci WiFi (wyższy priority = wyższy priorytet)
# UWAGA: Hasła są w secrets.yml (nie commitowany, w .gitignore)
# Skopiuj secrets.yml.example do secrets.yml i uzupełnij hasła
# wifi_networks jest definiowane w secrets.yml

# Podstawowe pakiety systemowe
base_packages:
  - git
  - curl
  - wget
  - htop
  - ufw
  - fail2ban
  - unattended-upgrades
  - python3-venv
  - python3-pip
  - build-essential
  - nvme-cli

# Docker (opcjonalne)
docker_install: true

# PostgreSQL client (jeśli będzie potrzebny)
postgres_client_install: false

# Nginx (ogólna konfiguracja)
nginx_install: false

# Hardening (w common role)
sysctl_swappiness: 10
docker_log_max_size: 50m
docker_log_max_file: 3
journald_max_size: 200M

# Docker maintenance - automatyczne czyszczenie
docker_cleanup_enabled: true
docker_cleanup_schedule: "0 3 * * 0"  # Co niedzielę o 3:00 (format cron: minute hour day month weekday)
docker_cleanup_prune_all: false  # true = usuwa wszystkie nieużywane obrazy, false = tylko dangling

# PostgreSQL w Dockerze
# UWAGA: Hasła (db_password) są w secrets.yml
postgres_instances:
  - name: shared
    db_name: shared
    db_user: shareduser
    # db_password w secrets.yml
    data_dir: /srv/postgres/shared/data  # Na 2TB NVMe
    backups_dir: /srv/postgres/shared/backups  # Symlink do /srv/backups/postgres/shared (na sda)
    shm_size: 512m
    shared_buffers: 1GB
    effective_cache_size: 3GB
    work_mem: 8MB
    maintenance_work_mem: 128MB
    ports:
      - "5434:5432"
    pgdata: /var/lib/postgresql/data/pgdata

postgres_image: postgres:18
postgres_network: dbnet
postgres_compose_dir: ~/stacks/db

# Caddy reverse proxy
proxy_install: true
proxy_image: caddy:2
proxy_compose_dir: ~/stacks/proxy
proxy_network: proxy
proxy_http_port: 80
proxy_https_port: 443

# Przykładowa konfiguracja domen (dostosuj pod siebie):
# proxy_domains:
#   - domain: example.com
#     email: admin@example.com
#     backend: app:8000
proxy_domains: []

# Backupy PostgreSQL
backups_enabled: true
backup_retention_days: 7
backup_time: "02:00"

# Konfiguracja backupów PostgreSQL - przeniesiona do secrets.yml
# postgres_backup_instances jest w secrets.yml

# Monitoring (Netdata)
monitoring_install: true
monitoring_port: 19999
monitoring_postgres_enabled: true  # Włącz monitorowanie PostgreSQL
monitoring_auth_enabled: true  # Włącz basic authentication (hasła w secrets.yml)

# Portainer
portainer_install: true
portainer_takeover: true  # Przejęcie istniejącego Portainera pod zarząd Ansible
portainer_container_name: portainer
portainer_port: 9000
portainer_image: portainer/portainer-ce:latest
portainer_data_dir: /srv/portainer/data  # Na sda (system)
portainer_compose_dir: ~/stacks/portainer
portainer_network: portainer_network

# Storage - dysk 2TB NVMe
# UWAGA: Ustaw storage_disk_device na właściwy dysk! Sprawdź przez: lsblk
storage_configure: true # Zmień na true gdy dysk będzie zamontowany
storage_disk_device: "/dev/nvme0n1" # np. /dev/nvme0n1 - ZMIEŃ przed uruchomieniem!
storage_mount_point: /mnt/data2tb
storage_filesystem: ext4
storage_label: data2tb
# Bind mounts są zdefiniowane w roli storage/defaults/main.yml
# Możesz nadpisać storage_bind_mounts tutaj jeśli potrzebujesz innych ścieżek

# Django application deployment
app_name: nc
app_repo_url: "git@github.com:pawlo884/nc.git"
app_repo_branch: main
app_port: 8000
app_expose_port: 8000
app_dockerfile_path: Dockerfile.prod

# Database connection (używa PostgreSQL z stacku nc)
# W Docker Compose kontener nazywa się nc-postgres-1, ale można użyć nazwy serwisu "postgres"
app_db_host: postgres  # Nazwa serwisu w docker-compose (Docker automatycznie rozwiąże do nc-postgres-1)
app_db_port: 5432
app_db_name: nc_prod
app_db_user: pawel
# app_db_password w secrets.yml

# Environment variables dla aplikacji
# UWAGA: SECRET_KEY i DATABASE_URL są w secrets.yml
app_env_vars:
  DEBUG: "False"
  # SECRET_KEY w secrets.yml
  ALLOWED_HOSTS: "*"
  # DATABASE_URL w secrets.yml
