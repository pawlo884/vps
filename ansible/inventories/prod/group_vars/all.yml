# Ogólne ustawienia VPS
vps_hostname: vps
vps_user: pawel

# Firewall
ufw_default_deny_incoming: true
ufw_default_allow_outgoing: true
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 8000, proto: tcp, comment: "Django app" }
  - { port: 19999, proto: tcp, comment: "Netdata monitoring" }

# Podstawowe pakiety systemowe
base_packages:
  - git
  - curl
  - wget
  - htop
  - ufw
  - fail2ban
  - unattended-upgrades
  - python3-venv
  - python3-pip
  - build-essential

# Docker (opcjonalne)
docker_install: true

# PostgreSQL client (jeśli będzie potrzebny)
postgres_client_install: false

# Nginx (ogólna konfiguracja)
nginx_install: false

# Hardening (w common role)
sysctl_swappiness: 10
docker_log_max_size: 50m
docker_log_max_file: 3
journald_max_size: 200M

# PostgreSQL w Dockerze
postgres_instances:
  - name: prod
    db_name: nc_prod
    db_user: appuser
    db_password: change_me_strong # ZMIEŃ przez --extra-vars lub vault!
    data_dir: /srv/postgres/prod/data
    backups_dir: /srv/postgres/prod/backups
    shm_size: 1g
    shared_buffers: 4GB
    effective_cache_size: 10GB
    work_mem: 32MB
    maintenance_work_mem: 512MB
  - name: test
    db_name: testdb
    db_user: testuser
    db_password: change_me_test # ZMIEŃ przez --extra-vars lub vault!
    data_dir: /srv/postgres/test/data
    backups_dir: /srv/postgres/test/backups
    shm_size: 512m
    shared_buffers: 2GB
    effective_cache_size: 6GB
    work_mem: 16MB
    maintenance_work_mem: 256MB

postgres_image: postgres:17
postgres_network: dbnet
postgres_compose_dir: ~/stacks/db

# Caddy reverse proxy
proxy_install: true
proxy_image: caddy:2
proxy_compose_dir: ~/stacks/proxy
proxy_network: proxy
proxy_http_port: 80
proxy_https_port: 443

# Przykładowa konfiguracja domen (dostosuj pod siebie):
# proxy_domains:
#   - domain: example.com
#     email: admin@example.com
#     backend: app:8000
proxy_domains: []

# Backupy PostgreSQL
backups_enabled: true
backup_retention_days: 7
backup_time: "02:00"

# Monitoring (Netdata)
monitoring_install: true
monitoring_port: 19999

# Storage - dysk 2TB NVMe
# UWAGA: Ustaw storage_disk_device na właściwy dysk! Sprawdź przez: lsblk
storage_configure: true # Zmień na true gdy dysk będzie zamontowany
storage_disk_device: "/dev/nvme0n1" # np. /dev/nvme0n1 - ZMIEŃ przed uruchomieniem!
storage_mount_point: /mnt/data2tb
storage_filesystem: ext4
storage_label: data2tb
# Bind mounts będą automatycznie utworzone z storage_bind_mounts w roli storage

# Django application deployment
app_name: nc
app_repo_url: "git@github.com:pawlo884/nc.git"
app_repo_branch: main
app_port: 8000
app_expose_port: 8000
app_dockerfile_path: Dockerfile.prod
app_docker_image: nc-django-app:latest
app_compose_dir: "/home/pawel/apps/nc"
app_docker_network: nc_network
app_user_uid: "1001:1001"
app_postgres_image: postgres:17-alpine
app_minio_image: minio/minio:latest
app_minio_client_image: minio/mc:latest
app_minio_console_port: "9100:9000"
app_minio_admin_port: "9101:9001"
app_minio_access_key: ncadmin
app_minio_secret_key: ncadminpass
app_minio_bucket: nc-media
app_minio_endpoint: "http://minio:9000"
app_minio_region: us-east-1
app_minio_addressing: path
app_minio_verify: "false"
app_env_file: ".env.prod"
app_manage_env: false
app_manage_repo: false

# Database connection (korzysta z kontenera Postgres w stacku aplikacji)
app_db_host: postgres
app_db_port: 5432
app_db_name: default
app_db_user: pawel
app_db_password: "Relisys17!"  # ZMIEŃ jeśli używasz innego hasła!
app_db_expose_port: "5432"

# Redis / Celery / Flower
app_redis_password: "Relisys17!!"  # Upewnij się, że spójne z .env
app_flower_basic_auth: "admin:dev_password"

# Environment variables dla aplikacji
app_env_vars:
  DEBUG: "False"
  SECRET_KEY: "django-secret-key-2ab06a88456d96e5165fb09e5310406ddc3fdb45198b978ae79c7bf7f827a4d8"  # Wygenerowany automatycznie
