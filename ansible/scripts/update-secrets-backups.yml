---
# Playbook do aktualizacji sekcji postgres_backup_instances w secrets.yml na serwerze
- hosts: web
  become: false
  tasks:
    - name: Sprawdź czy secrets.yml istnieje
      stat:
        path: "{{ inventory_dir }}/group_vars/secrets.yml"
      register: secrets_file
      
    - name: Aktualizuj postgres_backup_instances w secrets.yml
      blockinfile:
        path: "{{ inventory_dir }}/group_vars/secrets.yml"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - postgres_backup_instances"
        block: |
          # Konfiguracja backupów PostgreSQL (zawiera wrażliwe dane o strukturze)
          # Wszystkie ważne bazy z kontenerów PostgreSQL
          postgres_backup_instances:
            # Kontener nc-postgres-1 (produkcja)
            - name: nc_matterhorn1
              container: nc-postgres-1
              db_name: matterhorn1
              db_user: pawel
              backups_dir: /srv/backups/postgres/nc
            - name: nc_default
              container: nc-postgres-1
              db_name: default
              db_user: pawel
              backups_dir: /srv/backups/postgres/nc
            - name: nc_MPD
              container: nc-postgres-1
              db_name: MPD
              db_user: pawel
              backups_dir: /srv/backups/postgres/nc
            - name: nc_web_agent
              container: nc-postgres-1
              db_name: web_agent
              db_user: pawel
              backups_dir: /srv/backups/postgres/nc
            # Kontener nc-postgres-test (test)
            - name: test_zzz_matterhorn1
              container: nc-postgres-test
              db_name: zzz_matterhorn1
              db_user: pawel
              backups_dir: /srv/postgres/test/backups
            - name: test_zzz_default
              container: nc-postgres-test
              db_name: zzz_default
              db_user: pawel
              backups_dir: /srv/postgres/test/backups
            - name: test_zzz_MPD
              container: nc-postgres-test
              db_name: zzz_MPD
              db_user: pawel
              backups_dir: /srv/postgres/test/backups
            - name: test_default
              container: nc-postgres-test
              db_name: default
              db_user: pawel
              backups_dir: /srv/postgres/test/backups
            - name: test_zzz_web_agent
              container: nc-postgres-test
              db_name: zzz_web_agent
              db_user: pawel
              backups_dir: /srv/postgres/test/backups
      when: secrets_file.stat.exists
      
    - name: Informuj o braku pliku secrets.yml
      debug:
        msg: "Plik secrets.yml nie istnieje. Skopiuj secrets.yml.example do secrets.yml i uzupełnij hasła."
      when: not secrets_file.stat.exists

